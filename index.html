<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Открыть заметку в Obsidian</title>
  <link rel="stylesheet" href="opener.css">
  <script defer src="opener.js"></script>
</head>
<body>
  <main>
    <h1>Открыть заметку</h1>
    <p id="status" role="status">Проверяем ссылку…</p>
    <p id="note"></p>
    <a id="open" hidden>Открыть в Obsidian</a>
    <p class="hint">Для открытия нужен Obsidian с этим волтом на вашем устройстве.</p>
  </main>
</body>
</html>
